<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Enrollment Form</title>
        <link rel="icon" type="image/png" href="logo.png">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    </head>
<body style="background: url('background.jpg') no-repeat center center fixed; background-size: cover;">
    <nav>
        <!-- Logo on the left -->
        <div class="nav-logo">
            <a href="index.html"><img src="logo.png" alt="School Logo"></a>
        </div>
    
        <!-- Nav links centered -->
        <div class="nav-center">
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
                <li><a href="schedule.html" class="active"><i class="fas fa-calendar-alt"></i> Schedule</a></li>
                <li><a href="teachers.html"><i class="fas fa-chalkboard-teacher"></i> Teachers</a></li>
                <li><a href="register.html"><i class="fas fa-user-plus"></i> Register</a></li>
                <li><a href="admin.html"><i class="fas fa-user-shield"></i> Admin</a></li>
            </ul>
        </div>
    </nav>
    
<div class="page-wrapper">    
    <div class="container centered">
        <h2>Student Registration</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="date" id="dob" placeholder="Date of Birth">
        <input type="text" id="address" placeholder="Address">
        <input type="text" id="guardian" placeholder="Guardian Name">
        <input type="text" id="contact" placeholder="Contact Number">
        <select id="grade">
            <option value="">Select Grade</option>
            <option value="1">Grade 1</option>
            <option value="2">Grade 2</option>
            <option value="3">Grade 3</option>
            <option value="4">Grade 4</option>
            <option value="5">Grade 5</option>
            <option value="6">Grade 6</option>
            <option value="7">Grade 7</option>
            <option value="8">Grade 8</option>
            <option value="9">Grade 9</option>
            <option value="10">Grade 10</option>
        </select>
        <select id="studentType">
            <option value="">Select Student Type</option>
            <option value="New Student">New Student</option>
            <option value="Continuing Student">Continuing Student</option>
            <option value="Transferee">Transferee</option>
        </select>
            <button id="registerBtn">Enroll</button>
        <p id="message" style="text-align:center; font-weight:bold; color:green;"></p>
    </div>
</div>

<script type="module" src="register.js"></script>
</body>
</html>
