<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body { font-family: Arial, sans-serif; background: url('background.jpg') no-repeat center center fixed; background-size: cover; margin:0; padding:0; overflow-y:scroll; }
.container.centered { max-width: 1200px; margin: 30px auto; padding: 20px; }
button.btn { padding:8px 12px; border:none; border-radius:6px; cursor:pointer; background:#2d7cf0; color:#fff; font-size:14px; }
button.btn.danger { background:#e74c3c; }
button.btn.small { padding:4px 8px; font-size:0.85rem; margin:2px; }
.teacher-card { background: rgba(255,255,255,0.95); padding:15px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.08); }
.teacher-card h3 { margin:6px 0; font-size:1.05rem; }
#loginWrapper { max-width:360px; margin: 50px auto; padding:20px; background: rgba(255,255,255,0.95); border-radius:8px; text-align:center; }
#loginWrapper input { display:block; width:100%; padding:8px; margin:6px 0; border-radius:6px; border:1px solid #ccc; }
#loginWrapper button { margin:4px 2px; width:48%; }
#teachersGrid { display:grid; grid-template-columns: repeat(2,1fr); gap:20px; margin-top:20px; }
#searchBar { width:100%; padding:8px; margin:12px 0 20px 0; border-radius:6px; border:1px solid #ccc; }
#editForm { display:none; margin-top:20px; background:rgba(255,255,255,0.95); padding:12px; border-radius:8px; max-width:400px; }
#editForm input { width:100%; padding:6px; margin:6px 0; border-radius:6px; border:1px solid #ccc; }

/* Table Styles */
.student-table-wrapper { margin-top:20px; overflow:hidden; }
.student-table { width:100%; background:rgba(255,255,255,0.95); border-collapse:collapse; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.08); table-layout:fixed; }
.student-table thead { background:#2d7cf0; color:#fff; }
.student-table th { padding:12px 10px; text-align:left; font-weight:600; font-size:0.9rem; }
.student-table td { padding:10px 8px; border-bottom:1px solid #e0e0e0; font-size:0.9rem; word-wrap:break-word; }
.student-table tbody tr:hover { background:#f5f5f5; }
.student-table tbody tr:last-child td { border-bottom:none; }
.student-table .actions { text-align:center; width:100px; padding:10px 8px !important; }
.student-table .actions button { display:block; width:100%; margin:3px 0; }
.empty-state { text-align:center; padding:40px; color:#888; font-style:italic; background:rgba(255,255,255,0.95); border-radius:8px; }
button.btn:hover { opacity:0.9; }
button.btn.danger:hover { opacity:0.85; }
#teacherView { max-width:100%; overflow:hidden; }
</style>
</head>
<body>

<div class="container centered">

    <!-- LOGIN -->
    <div id="loginWrapper">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button id="elemLoginBtn" class="btn">Login Elementary</button>
        <button id="hsLoginBtn" class="btn">Login High School</button>
        <p id="loginMsg" style="color:red; margin-top:12px;"></p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none; text-align:center;">
        <img id="dashboardLogo" src="logo.png" alt="School Logo" style="max-width:150px; margin-bottom:15px;">
        <br>
        <button id="backBtn" class="btn danger">Logout</button>
        <h2 id="dashboardTitle"></h2>
        <input type="text" id="searchBar" placeholder="Search student by name...">
        <div id="teachersGrid" class="teachers-grid"></div>
    </div>

    <!-- VIEW TEACHER STUDENTS -->
    <div id="teacherView" style="display:none;">
        <div style="margin-bottom:15px;">
            <button id="teacherBackBtn" class="btn danger">Back to Dashboard</button>
        </div>
        <h2 id="teacherTitle" style="margin-top:0;"></h2>
        <div id="teacherStudentList" class="student-table-wrapper"></div>
    </div>

    <!-- EDIT FORM -->
    <div id="editForm">
        <h3>Edit Student</h3>
        <input id="editStudentID" placeholder="Student ID" readonly style="background:#f0f0f0;">
        <input id="editName" placeholder="Full name">
        <input id="editDob" type="date">
        <input id="editAddress" placeholder="Address">
        <input id="editGuardian" placeholder="Guardian">
        <input id="editContact" placeholder="Contact">
        <input id="editStudentType" placeholder="Student Type">
        <button id="saveEditBtn" class="btn">Save</button>
        <button id="cancelEditBtn" class="btn danger">Cancel</button>
    </div>

</div>

<script type="module" src="admin.js"></script>
</body>

</html>
